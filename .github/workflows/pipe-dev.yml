name: "[DEPLOY] Develop Pipeline"

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:

  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    if: ${{ vars.SENTRY_ORG != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        with:
          projects: ${{ vars.SENTRY_PROJECT_FRONTEND }} ${{ vars.SENTRY_PROJECT_BACKEND }}
          version: ${{ github.sha }}
          environment: staging
          set_commits: auto
