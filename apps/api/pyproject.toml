[tool.poetry]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.135.0"
uvicorn = "^0.37.0"
pydantic = "^2.11.9"
pydantic-settings = "^2.11.0"
python-multipart = "^0.0.20"
python-dotenv = "^1.1.1"
alembic = "^1.16.5"
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
greenlet = "^3.1.1"
uvloop = "^0.21.0"
httptools = "^0.6.4"
tenacity = "^9.1.2"
boto3 = "^1.35.0"
celery = "^5.4.0"
redis = "^5.2.0"
httpx = "^0.28.1"
itsdangerous = "^2.2.0"
psycopg = {extras = ["binary"], version = "^3.2.12"}
sentry-sdk = {extras = ["fastapi"], version = "^2.53.0"}
pytest-cov = "^7.0.0"
pandas = "^3.0.1"
openpyxl = "^3.1.5"
elevenlabs = "^2.39.0"
anthropic = "^0.84.0"
google-genai = "^1.67.0"
moviepy = "^2.2.1"
langchain-anthropic = "^1.3.5"
langchain-core = "^1.2.19"
langchain-google-genai = "^4.2.1"
pillow = ">=9.2.0,<12.0"
asgiref = "^3.11.1"
slowapi = "^0.1.9"
openai = "^2.28.0"
opencv-python-headless = "^4.13.0.92"
litellm = "^1.82.3"

[tool.poetry.scripts]
start = "api.main:main"
celery-worker = "api.deps.celery:main"
dev = "api.scripts.dev:main"
preview-video = "api.scripts.preview_video:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
mypy = "^1.18.2"
ruff = "^0.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["alembic", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "T",    # flake8-print
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "Q",    # flake8-quotes
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "COM812", # missing trailing comma
    "COM819", # prohibited trailing comma
    "RUF001", # ambiguous unicode (en dashes in prompts/descriptions are intentional)
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"__tests__/**" = ["ARG"]  # unused args are common in test fixtures

[tool.ruff.lint.isort]
known-first-party = ["api", "graphs", "__tests__"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["api", "graphs"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
testpaths = ["__tests__"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not eval and not benchmark'"
markers = [
    "eval: LLM-based evaluation tests (require OPENAI_API_KEY, slow)",
    "benchmark: Quality benchmark tests comparing against reference profiles (slow, requires LLM)",
]

[tool.pylint]
ignore-paths = ["alembic"]
